# Warehouse zones for the Gazebo world: 4 columns x 3 rows of 3 m cells over the 12 x 9 m floor (world frame == map frame).
# Zone R<row>C<col>; row 0 / col 0 is the bottom-left cell (the dock, where the robot starts).
dynamic:
  enabled: false

grid:
  origin: [0.0, 0.0]
  rows: 3
  cols: 4
  cell_w: 3.0
  cell_h: 3.0
default_risk: 0.3
risk:
  "0,0": 0.6            # dock
  "1,3": 0.9            # next to the east door
  "2,3": 0.7
  "2,0": 0.5
blocked: []
