# Robot parameters for the mechatronics calculator.
#
# Each entry:
#   value    : the number used in the calculations
#   unit     : shown when editing / printing (not used in the maths)
#   desc     : one-line explanation
#   confirm  : true  -> this is an estimate, replace with a real figure
#             false -> taken from the BeetleBot spec sheet / a physical constant
#
# Seed values are for the VEEROBOT BeetleBot
# (docs/beetlebot/01-introduction.md). Edit them in the program
# (menu -> Edit robot parameters -> Save) or here by hand.

mass_kg:
  value: 2.2
  unit: kg
  desc: Total robot mass including battery and payload
  confirm: false

wheel_radius_m:
  value: 0.0485
  unit: m
  desc: Drive wheel radius (guess for a ~97 mm wheel)
  confirm: true

total_wheels:
  value: 4
  unit: count
  desc: Total wheels touching the ground
  confirm: false

driven_wheels:
  value: 4
  unit: count
  desc: Number of powered wheels (skid-steer BeetleBot drives all four)
  confirm: false

top_speed_mps:
  value: 1.0
  unit: m/s
  desc: Target / rated top speed
  confirm: false

accel_time_s:
  value: 2.0
  unit: s
  desc: Time to accelerate from rest to top speed
  confirm: true

climb_angle_deg:
  value: 10.0
  unit: deg
  desc: Slope angle the robot must be able to climb
  confirm: true

rolling_resistance_coeff:
  value: 0.015
  unit: "-"
  desc: Rolling-resistance coefficient C_rr (wheel/bearing drag)
  confirm: true

surface_friction_coeff:
  value: 0.8
  unit: "-"
  desc: Tyre-to-ground friction coefficient mu_s (traction / grip limit)
  confirm: true

gravity_mps2:
  value: 9.81
  unit: m/s^2
  desc: Gravitational acceleration
  confirm: false

drivetrain_efficiency:
  value: 0.85
  unit: "-"
  desc: Combined gearbox + drivetrain efficiency (0-1)
  confirm: true

gear_ratio:
  value: 56.0
  unit: ":1"
  desc: Motor-shaft to wheel gear reduction (JGB37-3530 class motor)
  confirm: true

motor_no_load_rpm:
  value: 230.0
  unit: rpm
  desc: Wheel-output no-load speed at nominal voltage (after the gearbox)
  confirm: true

battery_voltage_nom_v:
  value: 11.1
  unit: V
  desc: Nominal pack voltage (3S Li-ion)
  confirm: false

battery_capacity_ah:
  value: 10.0
  unit: Ah
  desc: Battery pack capacity
  confirm: false

battery_usable_fraction:
  value: 0.8
  unit: "-"
  desc: Fraction of pack capacity usable before the low-voltage cutoff
  confirm: true

avg_current_draw_a:
  value: 1.6
  unit: A
  desc: Average total current draw during operation (drive + electronics)
  confirm: true

design_safety_factor:
  value: 1.5
  unit: "-"
  desc: Safety factor applied to the required motor torque when sizing a motor
  confirm: true

motor_stall_torque_nm:
  value: 0.8
  unit: N*m
  desc: Motor stall torque at nominal voltage (after the gearbox) - for a headroom check
  confirm: true

# --- Differential-drive kinematics & dynamics ---
# (used by the calculations taken from
#  docs/Kinematics and Dynamics_AMR_Problems.pdf)

track_width_m:
  value: 0.30
  unit: m
  desc: Distance between the left and right wheel contact lines (L)
  confirm: true

wheel_omega_left_rads:
  value: 4.0
  unit: rad/s
  desc: Left wheel angular velocity (forward-kinematics input)
  confirm: true

wheel_omega_right_rads:
  value: 6.0
  unit: rad/s
  desc: Right wheel angular velocity (forward-kinematics input)
  confirm: true

heading_deg:
  value: 45.0
  unit: deg
  desc: Robot heading in the global frame (theta)
  confirm: true

path_linear_speed_mps:
  value: 1.0
  unit: m/s
  desc: Desired forward speed along a path (inverse-kinematics input)
  confirm: true

path_radius_m:
  value: 2.0
  unit: m
  desc: Radius of the circular path to follow (R)
  confirm: true

initial_speed_mps:
  value: 0.0
  unit: m/s
  desc: Speed at the start of an acceleration phase (v_i)
  confirm: false

moment_of_inertia_kgm2:
  value: 0.05
  unit: kg*m^2
  desc: Yaw moment of inertia about the robot's centre of mass (I)
  confirm: true

angular_accel_rads2:
  value: 2.0
  unit: rad/s^2
  desc: Target angular acceleration for a spin-on-the-spot manoeuvre (alpha)
  confirm: true
