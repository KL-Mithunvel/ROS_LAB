# Pi tunnel rig settings. Pins are BCM GPIO numbers (not header pin numbers).
udp_port: 4210          # must match udp_port in ../panel_config.yaml
pins:
  left_a: 12            # header pin 32 -> MDD3A M1A (left forward)
  left_b: 13            # header pin 33 -> MDD3A M1B (left reverse)
  right_a: 19           # header pin 35 -> MDD3A M2A (right forward)
  right_b: 16           # header pin 36 -> MDD3A M2B (right reverse)
invert_left: true       # same as the ESP32 build; flip if a side runs backwards
invert_right: true
pwm_hz: 1000            # software PWM; the MDD3A accepts up to 20 kHz
default_level: 6        # speed level 0-9 at start
cmd_timeout_ms: 500     # no drive command for this long -> motors stop
ramp_per_step: 12       # duty change per ramp_ms
ramp_ms: 10
rssi_report: -50        # wired link has no RSSI; a fixed value keeps the panel health bar usable
